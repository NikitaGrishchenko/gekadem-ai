# Local development: backend and Vite run on the host with npm.
# Configure .env as described in README.md, then run docker compose up -d --wait.
services:
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data-node:/data/db
    command: ["mongod", "--noauth", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  admin-panel:
    image: registry.librechat.ai/librechat-ai/librechat-admin-panel:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PANEL_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:-}
      API_SERVER_URL: http://host.docker.internal:${PORT:-3080}
      VITE_API_BASE_URL: ${DOMAIN_CLIENT:-http://localhost:3090}
      SESSION_COOKIE_SECURE: "false"

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_HOST: http://0.0.0.0:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - ./meili_data_v1.35.1:/meili_data

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:${RAG_PORT:-8000}"
    depends_on:
      vectordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DB_HOST: vectordb
      DB_PORT: "5432"
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      RAG_PORT: ${RAG_PORT:-8000}

volumes:
  pgdata2:
